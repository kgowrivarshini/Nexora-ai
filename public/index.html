<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Nexora AI, your college information assistant.">
    <title>Nexora AI — New chat</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="auth-shell" id="auth-shell" aria-live="polite"></main>
    <div class="app-shell" id="app-shell" hidden>
      <button class="mobile-scrim" id="mobile-scrim" aria-label="Close navigation" hidden></button>
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="sidebar-header">
          <a class="brand" href="#" data-nav="chat" aria-label="Nexora AI home">Nexora AI</a>
          <div class="sidebar-header-actions">
            <button class="sidebar-icon-button" id="sidebar-search-toggle" type="button" aria-label="Search chats" aria-expanded="false">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
            </button>
            <button class="sidebar-icon-button sidebar-collapse" id="sidebar-collapse" type="button" aria-label="Collapse sidebar">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="2"/><path d="M7 3v14"/></svg>
            </button>
          </div>
        </div>
        <input class="sidebar-search" id="sidebar-search" type="search" placeholder="Search chats" aria-label="Search chats" hidden>

        <button class="new-chat-button" id="new-chat">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.8 3.5 3.7 3.7-9.8 9.8-4.2.8.8-4.2 9.5-10.1Z"/><path d="m11.3 5 3.7 3.7"/></svg>
          <span>New chat</span>
        </button>

        <nav class="primary-nav" aria-label="Navigation">
          <button class="nav-item" data-nav="scheduled">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.25"/><path d="M10 5.5v4.8l3 1.8"/></svg>
            <span>Scheduled</span>
          </button>
          <button class="nav-item" data-nav="downloads">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h4.5l2 2H16a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 16 16.5H4A1.5 1.5 0 0 1 2.5 15V5A1.5 1.5 0 0 1 4 3.5Z"/></svg>
            <span>Library</span>
          </button>
        </nav>

        <section class="recent-section" aria-labelledby="recent-title">
          <div class="section-label" id="recent-title">Pinned</div>
          <div class="recent-list" id="recent-list"></div>
          <p class="recent-empty" id="recent-empty">Your pinned chats will appear here.</p>
        </section>

        <button class="profile-button" id="profile-button" aria-expanded="false">
          <span class="avatar">V</span>
          <span class="profile-copy"><strong>Vinay</strong><small>Go</small></span>
          <svg class="profile-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg>
        </button>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
            </button>
            <div class="page-title" id="page-title">New chat</div>
          </div>
          <div class="topbar-actions">
            <button class="icon-button top-notifications" id="top-notifications" aria-label="Open notifications">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8a5 5 0 0 1 10 0c0 5 2 5.5 2 6.5H3C3 13.5 5 13 5 8Zm3.5 9h3"/></svg>
              <span class="notification-dot" id="notification-dot" hidden></span>
            </button>
          </div>
        </header>

        <div class="page-content">
          <section class="chat-page" id="chat-page" aria-label="Chat">
            <div class="welcome-view" id="welcome-view">
              <h1>Ready when you are.</h1>

              <form class="composer" id="chat-form">
                <input type="file" id="attachment-input" multiple hidden accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg">
                <button class="attach-button" type="button" id="attach-button" aria-label="Attach files">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 10.5 5.7-5.7a2.12 2.12 0 0 1 3 3l-7.1 7.1a4 4 0 0 1-5.7-5.7l7.1-7.1"/></svg>
                </button>
                <textarea id="message-input" rows="1" placeholder="Ask Nexora" aria-label="Your message"></textarea>
                <button class="voice-button" id="voice-input" type="button" aria-label="Voice input (not available yet)">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5m-3 0h6"/></svg>
                </button>
                <button class="send-button" type="submit" aria-label="Send message">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 12-6-3.8 12-2.5-5.2L4 10Z"/><path d="m9.7 10.8 3.1-3.1"/></svg>
                </button>
              </form>
              <div class="attachment-list" id="attachment-list" aria-live="polite"></div>

              <div class="suggestion-grid" id="suggestion-grid">
                <button class="suggestion-card" data-prompt="What are the academic regulations for B.Tech students, including attendance criteria and autonomous syllabus rules?">
                  <span class="suggestion-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2.5 6 3.2v4.7c0 3.3-2.5 5.8-6 7.1-3.5-1.3-6-3.8-6-7.1V5.7L10 2.5Z"/><path d="m7.5 10 1.7 1.7 3.3-3.5"/></svg></span>
                  <span class="suggestion-title">Academic Regulations</span>
                </button>
                <button class="suggestion-card" data-prompt="What placement and training information is available, including recent drives, recruiters, and eligibility criteria?">
                  <span class="suggestion-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5h13v10h-13zM7 5V3.5h6V5m-9.5 4h13m-8 0v2h3v-2"/></svg></span>
                  <span class="suggestion-title">Placement &amp; Training</span>
                </button>
                <button class="suggestion-card" data-prompt="Where can I find the latest syllabus, study materials, and previous question papers for my course?">
                  <span class="suggestion-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.75h7l4 4v10.5H5z"/><path d="M12 2.75v4h4m-7 3.5h3m-3 3h5"/></svg></span>
                  <span class="suggestion-title">Syllabus &amp; Materials</span>
                </button>
                <button class="suggestion-card" data-prompt="Can you help me find college-life information such as bus routes, library timings, events, and contacts?">
                  <span class="suggestion-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8a5 5 0 0 1 10 0c0 5 2 5.5 2 6.5H3C3 13.5 5 13 5 8Zm3.5 9h3"/></svg></span>
                  <span class="suggestion-title">College Life &amp; Timetable</span>
                </button>
              </div>
            </div>

            <div class="conversation-view" id="conversation-view" hidden>
              <div class="message-list" id="message-list" aria-live="polite"></div>
              <div class="chat-bottom">
                <div class="attachment-list" id="conversation-attachment-list" aria-live="polite"></div>
                <form class="composer" id="conversation-form">
                  <input type="file" multiple hidden accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg">
                  <button class="attach-button" type="button" data-attach aria-label="Attach files">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 10.5 5.7-5.7a2.12 2.12 0 0 1 3 3l-7.1 7.1a4 4 0 0 1-5.7-5.7l7.1-7.1"/></svg>
                  </button>
                  <textarea id="conversation-input" rows="1" placeholder="Write a message..." aria-label="Your message"></textarea>
                  <button class="voice-button" type="button" aria-label="Voice input (not available yet)">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5m-3 0h6"/></svg>
                  </button>
                  <button class="send-button" type="submit" aria-label="Send message">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4m-5 5 5-5 5 5"/></svg>
                  </button>
                </form>
                <p class="privacy-note">AI responses may be inaccurate. Verify important college information with an official source.</p>
              </div>
            </div>
          </section>

          <section class="utility-page" id="utility-page" hidden aria-live="polite"></section>
        </div>
      </main>

      <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    </div>
  </body>
</html>
